name: Buffer QGIS Process
executor: qgis-process
config:
  algorithm: native:buffer
arguments:
  INPUT: data/enschede/point.shp
  OUTPUT: output.shp
  distance_units: meters
  area_units: m2
  ellipsoid: EPSG:7030
  SEGMENTS: 19
  END_CAP_STYLE: 0
  JOIN_STYLE: 0
  MITER_LIMIT: 2
  DISSOLVE: false
  SEPARATE_DISJOINT: false
  DISTANCE:
    - 0.001
    - 0.002
repeat: 1
inputs:
  - INPUT
outputs:
  - OUTPUT
